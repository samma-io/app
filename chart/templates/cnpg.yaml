{{- if .Values.cloudnativepg.enabled }}
# ── ImageCatalog ──────────────────────────────────────────────────────────────
# Lists TimescaleDB-HA images for each supported PostgreSQL major version.
# The Cluster below references this catalog via imageCatalogRef so CNPG can
# validate and manage image selection per major version.
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: {{ .Values.cloudnativepg.clusterName }}-timescaledb
  labels:
    {{- include "samma-app.labels" . | nindent 4 }}
spec:
  images:
    - major: 14
      image: "timescale/timescaledb-ha:pg14"
    - major: 15
      image: "timescale/timescaledb-ha:pg15"
    - major: 16
      image: "timescale/timescaledb-ha:pg16"
    - major: 17
      image: "timescale/timescaledb-ha:pg17"
---
# ── Cluster ───────────────────────────────────────────────────────────────────
# CloudNativePG Cluster backed by TimescaleDB-HA.
# The operator creates a secret "{{ .Values.cloudnativepg.clusterName }}-app"
# with keys: uri, jdbc-uri, pgpass, dbname, host, port, user, password.
# The "uri" key is mounted as DATABASE_URL in the app and migration containers.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cloudnativepg.clusterName }}
  labels:
    {{- include "samma-app.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cloudnativepg.instances }}
  postgresUID: 70
  postgresGID: 70
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: {{ .Values.cloudnativepg.clusterName }}-timescaledb
    major: {{ .Values.cloudnativepg.imageCatalog.postgresMajor }}

  bootstrap:
    initdb:
      database: {{ .Values.cloudnativepg.database | quote }}
      owner: {{ .Values.cloudnativepg.owner | quote }}
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;

  storage:
    size: {{ .Values.cloudnativepg.storage }}
    {{- if .Values.cloudnativepg.storageClass }}
    storageClassName: {{ .Values.cloudnativepg.storageClass | quote }}
    {{- end }}
{{- end }}
