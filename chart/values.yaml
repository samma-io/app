replicaCount: 1

fullnameOverride: "samma-app"

image:
  repository: ghcr.io/samma-io/app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: http
    acme.cert-manager.io/http01-edit-in-place: "true"
    kubernetes.io/ingress.class: traefik
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
  hosts:
    - host: www.samma.io
      paths:
        - path: /
          pathType: Prefix
    - host: samma.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: samma-io-tls
      hosts:
        - www.samma.io
        - samma.io

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ─── CloudNativePG ────────────────────────────────────────────────────────────
# Manages the main application database via the CloudNativePG operator.
# The operator creates a secret <clusterName>-app containing the connection URI
# which is injected as DATABASE_URL into the app and migration containers.
#
# TimescaleDB is used as the PostgreSQL distribution so the same cluster can
# serve time-series workloads if needed.
#
# If the cluster already exists in the namespace, Helm will adopt it; set
# clusterName to match your existing CNPG Cluster name.
cloudnativepg:
  enabled: true
  # Must match the name of your existing CNPG Cluster (or the name to create).
  clusterName: samma-pg
  instances: 1
  storage: 5Gi
  # Leave empty to use the cluster default StorageClass.
  storageClass: ""
  # Database and role created by CNPG inside the cluster.
  database: samma
  owner: samma
  # UID/GID of the postgres process inside the container.
  # timescale/timescaledb-ha uses 1000; standard postgres images use 26.
  postgresUID: 1000
  postgresGID: 1000

  # ── ImageCatalog ──────────────────────────────────────────────────────────
  # An ImageCatalog is created in the same namespace listing TimescaleDB-HA
  # images per major PostgreSQL version. The Cluster references it via
  # imageCatalogRef so CNPG can pick the right image for in-place upgrades.
  imageCatalog:
    # TimescaleDB version tag appended to each image, e.g. "2.17.2"
    timescaledbVersion: "2.17.2"
    # Which major PostgreSQL version the Cluster should use.
    postgresMajor: 16

# ─── Secrets ──────────────────────────────────────────────────────────────────
# All app configuration is loaded from a single Kubernetes Secret via envFrom.
#
# Two modes:
#   secrets.create: false  (default) — Secret must already exist in the cluster.
#                                       Create it manually or via External Secrets:
#
#   kubectl create secret generic samma-app-secrets \
#     --from-literal=SCANNER_DATABASE_URL="postgresql://user:pass@host:5432/samma" \
#     --from-literal=NEXTAUTH_URL="https://samma.io" \
#     --from-literal=NEXTAUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=EMAIL_SERVER_HOST="smtp.example.com" \
#     --from-literal=EMAIL_SERVER_PORT="587" \
#     --from-literal=EMAIL_SERVER_USER="noreply@samma.io" \
#     --from-literal=EMAIL_SERVER_PASSWORD="<password>" \
#     --from-literal=EMAIL_FROM="Samma.io <noreply@samma.io>" \
#     --from-literal=OPERATOR_API_URL="http://samma-io-operator.samma-io.svc.cluster.local:5000"
#   # DATABASE_URL is omitted above — injected from the CNPG secret automatically.
#
#   secrets.create: true  — Chart creates the Secret from secrets.data below.
#                           Only use for dev/testing; avoid committing credentials.
secrets:
  create: false
  name: samma-app-secrets
  data:
    # DATABASE_URL is injected from the CNPG-generated secret (<clusterName>-app)
    # and must NOT be set here.
    # TimescaleDB for scanner results (scan_results table, joined via samma_id).
    SCANNER_DATABASE_URL: ""
    NEXTAUTH_URL: "https://samma.io"
    NEXTAUTH_SECRET: ""
    EMAIL_SERVER_HOST: ""
    EMAIL_SERVER_PORT: "587"
    EMAIL_SERVER_USER: ""
    EMAIL_SERVER_PASSWORD: ""
    EMAIL_FROM: "Samma.io <noreply@samma.io>"
    # Internal URL of the Kubernetes operator Flask API.
    # Example: http://samma-io-operator.samma-io.svc.cluster.local:5000
    OPERATOR_API_URL: ""

# ─── Database Migrations ──────────────────────────────────────────────────────
# An init container runs `prisma migrate deploy` before the app starts,
# ensuring the schema is always up to date on every rollout.
migration:
  enabled: true

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
