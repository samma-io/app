name: Deploy To Production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  workflow_run:
    workflows: [Docker Publish]
    types:
      - completed

jobs:
  deploy:
    runs-on: arc-runner-set-samma
    # workflow_run matches "Docker Publish" by name only, so gate on what the
    # triggering run actually was: a successful build of a push to main.
    # Tag pushes, the weekly schedule and manual runs of Docker Publish do not
    # deploy.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # The commit Docker Publish built and tagged the image with. Under
      # workflow_run, github.sha is whatever main points at when this run
      # starts, which can be a newer commit whose image is not pushed yet.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Chart and image tag come from the same commit.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Check out Manifest
        uses: actions/checkout@v4
        with:
          repository: samma-io/deploy
          ref: main
          path: deploy
          ssh-key: ${{ secrets.SAM_SSH }}

      - name: Deploy
        uses: WyriHaximus/github-action-helm3@v3
        with:
          exec: |
            helm template samma-app chart/ --set image.tag=${{ env.DEPLOY_SHA }} > deploy/app/deploy.yaml
            cat deploy/app/deploy.yaml

      - name: GIT commit and push all changed files
        env:
          CI_COMMIT_MESSAGE: Continuous Integration Build Artifacts
          CI_COMMIT_AUTHOR: Continuous Integration
        run: |
          cd deploy
          git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
          git config --global user.email "username@users.noreply.github.com"
          git add app/deploy.yaml
          git commit -a -m "${{ env.CI_COMMIT_MESSAGE }}"
          git push

      - name: Send custom JSON data to Slack workflow
        id: slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text":"The repo ${{ github.repository }} is build and ready for cluster to deploy"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
