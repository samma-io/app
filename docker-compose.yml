services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: samma
      POSTGRES_PASSWORD: samma
      POSTGRES_DB: samma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samma"]
      interval: 5s
      timeout: 5s
      retries: 5

  samma-web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: sh -c "node node_modules/.bin/prisma migrate deploy && node server.js"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  samma-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma migrate deploy && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - samma_dev_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

volumes:
  postgres_data:
  samma_dev_modules:
